<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Space Defense - Full Game</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    
    <script>
      let score = 0;
      let gameActive = true;

      // 1. Компонент для создания врагов
      AFRAME.registerComponent('spawner', {
        init: function () {
          this.timer = 0;
        },
        tick: function (time, timeDelta) {
          if (!gameActive) return;
          this.timer += timeDelta;
          if (this.timer > 2000) { // Каждые 2 секунды
            this.spawnEnemy();
            this.timer = 0;
          }
        },
        spawnEnemy: function () {
          let enemy = document.createElement('a-sphere');
          let posX = (Math.random() - 0.5) * 20; 
          enemy.setAttribute('class', 'enemy'); // Обязательно класс enemy для прицела
          enemy.setAttribute('color', 'red');
          enemy.setAttribute('radius', '0.7');
          enemy.setAttribute('position', posX + ' 15 -15');
          enemy.setAttribute('dynamic-body', 'shape: sphere');
          enemy.setAttribute('enemy-logic', '');
          this.el.sceneEl.appendChild(enemy);
        }
      });

      // 2. Логика врагов (Проверка падения)
      AFRAME.registerComponent('enemy-logic', {
        tick: function () {
          if (!gameActive) return;
          // Надежная проверка: если шарик опустился ниже Y = 0.5 (коснулся земли)
          if (this.el.object3D.position.y <= 0.5) {
            gameActive = false;
            document.querySelector('#gameOverText').setAttribute('visible', true);
          }
        }
      });

      // 3. НОВАЯ ЛОГИКА СТРЕЛЬБЫ: Тап в любом месте экрана
      AFRAME.registerComponent('shooter', {
        init: function () {
          // Слушаем клик мыши (для ПК) и касание экрана (для телефона)
          window.addEventListener('mousedown', this.shoot.bind(this));
          window.addEventListener('touchstart', this.shoot.bind(this));
        },
        shoot: function () {
          if (!gameActive) return;
          
          // Получаем список объектов, на которые сейчас смотрит прицел
          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          // Если в прицеле есть хоть один объект
          if (intersected.length > 0) {
            let target = intersected[0]; // Берем первый объект
            
            // Проверяем, враг ли это
            if (target.classList.contains('enemy')) {
              score++;
              document.querySelector('#scoreText').setAttribute('value', 'Score: ' + score);
              // Удаляем сбитый шарик
              target.parentNode.removeChild(target);
            }
          }
        }
      });

      // 4. ИСПРАВЛЕННЫЙ поворот турели (Синхронизация с гироскопом)
      AFRAME.registerComponent('sync-rotation', {
        tick: function () {
          let cameraEl = document.querySelector('#camera');
          if (cameraEl) {
            // Читаем поворот камеры напрямую из 3D-движка (это работает на телефонах)
            let cameraRotationY = cameraEl.object3D.rotation.y;
            // Применяем этот поворот к турели
            this.el.object3D.rotation.y = cameraRotationY;
          }
        }
      });
    </script>
  </head>
  <body>
    <!-- Добавлен компонент shooter на всю сцену -->
    <a-scene physics="debug: false" spawner shooter>
      
      <a-assets>
        <img id="space-texture" src="assets/space.jpg">
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
        <img id="result-img" src="https://img.icons8.com/clouds/500/000000/trophy.png">
      </a-assets>

      <a-sky src="#space-texture"></a-sky>

      <!-- ИСПРАВЛЕННЫЙ ПОЛ: Теперь это толстый непрозрачный ящик темно-серого цвета -->
      <!-- Высота 2, позиция -1 означает, что его "поверхность" находится на уровне 0 -->
      <a-box id="ground" static-body position="0 -1 0" width="100" height="2" depth="100" color="#222222"></a-box>

      <!-- ТУРЕЛЬ: Изменен компонент на sync-rotation -->
      <a-entity id="player-turret" 
                gltf-model="#turret-model" 
                position="0 0 -2" 
                scale="0.3 0.3 0.3" 
                sync-rotation>
        <a-text id="scoreText" value="Score: 0" position="0 8 0" align="center" color="cyan" width="20"></a-text>
      </a-entity>

      <!-- ТЕКСТ ЗАВЕРШЕНИЯ ИГРЫ -->
      <a-entity id="gameOverText" visible="false" position="0 2 -4">
        <a-text value="GAME OVER" color="red" align="center" width="10"></a-text>
        <a-image src="#result-img" position="0 -1 0"></a-image>
      </a-entity>

      <!-- КАМЕРА И ПРИЦЕЛ -->
      <a-entity id="camera" camera look-controls position="0 1.6 0">
        <!-- Настроили прицел так, чтобы он "видел" только объекты с классом enemy -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: yellow; shader: flat">
        </a-entity>
      </a-entity>

      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="1 4 3"></a-entity>

    </a-scene>
  </body>
</html>
