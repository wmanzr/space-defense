<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      window.score = 0;

      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.gameStarted = false;
          this.enemiesSpawned = false;

          window.addEventListener('touchstart', this.onTap.bind(this));
          window.addEventListener('mousedown', this.onTap.bind(this));
        },

        onTap: function () {
          // 1. Принудительно запускаем видео с камеры (обход защиты Apple)
          let video = document.querySelector('video');
          if (video) video.play();

          // 2. Логика первого тапа (Разрешения)
          if (!this.gameStarted) {
            this.gameStarted = true;
            this.initPermissions();
          } 
          // 3. Логика стрельбы
          else if (this.enemiesSpawned) {
            this.shoot();
          }
        },

        initPermissions: function () {
          let infoText = document.querySelector('#infoText');
          infoText.setAttribute('value', 'REQUESTING PERMISSIONS...');

          // Гироскоп
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
              .then(state => {
                if (state === 'granted') this.getGPS(infoText);
                else infoText.setAttribute('value', 'GYRO DENIED!');
              })
              .catch(console.error);
          } else {
            this.getGPS(infoText);
          }
        },

        getGPS: function (infoText) {
          infoText.setAttribute('value', 'SEARCHING GPS...');

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              infoText.setAttribute('value', 'ENEMIES DETECTED!');
              
              let lat = pos.coords.latitude;
              let lon = pos.coords.longitude;
              
              // Вывод координат
              document.querySelector('#debugText').setAttribute('value', `LAT: ${lat.toFixed(5)}\nLON: ${lon.toFixed(5)}`);

              if (!this.enemiesSpawned) {
                this.enemiesSpawned = true;
                
                // ОЧЕНЬ МАЛЕНЬКОЕ СМЕЩЕНИЕ (Враги появятся буквально в 2-3 метрах от тебя)
                let offset = 0.00002; 
                
                this.spawnEnemy(lat + offset, lon); 
                this.spawnEnemy(lat, lon + offset); 
                this.spawnEnemy(lat - offset, lon - offset); 
              }
            },
            (err) => {
              infoText.setAttribute('value', 'GPS ERROR! TAP TO RETRY');
              this.gameStarted = false; 
            },
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 0 }
          );
        },

        spawnEnemy: function(lat, lon) {
          let scene = document.querySelector('a-scene');
          let enemy = document.createElement('a-entity');
          
          // Враги статичные, без анимации
          enemy.setAttribute('geometry', 'primitive: sphere; radius: 1.5');
          enemy.setAttribute('material', 'color: #ff00ff; shader: flat');
          enemy.setAttribute('class', 'enemy');
          enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          enemy.setAttribute('position', '0 1 0'); // Высота 1 метр (на уровне груди)
          
          scene.appendChild(enemy);
        },

        shoot: function () {
          // НАДЕЖНАЯ ОТДАЧА ТУРЕЛИ ЧЕРЕЗ JAVASCRIPT
          let turret = document.querySelector('#player-turret');
          if(turret) {
            turret.setAttribute('position', '0 -1 -1.3'); // Дергаем назад
            setTimeout(() => {
              turret.setAttribute('position', '0 -1 -1.5'); // Возвращаем на место через 100мс
            }, 100);
          }

          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              target.parentNode.removeChild(target);
              
              let infoText = document.querySelector('#infoText');
              if (window.score >= 3) {
                infoText.setAttribute('value', 'MISSION ACCOMPLISHED!');
                infoText.setAttribute('color', '#00FF00');
              } else {
                infoText.setAttribute('value', 'KILLED: ' + window.score + ' / 3');
              }
            }
          }
        }
      });
    </script>
    
    <style> 
      /* СКРЫВАЕМ КРИВОЕ ОКНО AR.js "Author camera permission..." */
      div[style*="z-index: 10000"] { display: none !important; }
      /* Скрываем кнопку VR */
      .a-enter-vr { display: none !important; } 
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- СЦЕНА -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      game-manager>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <!-- КАМЕРА -->
      <a-camera id="main-camera" gps-camera="positionMinAccuracy: 100000;" rotation-reader>
        
        <!-- СТАРТОВАЯ НАДПИСЬ (Шрифт уменьшен: width="2") -->
        <a-text id="infoText" value="TAP SCREEN TO START" position="0 0.5 -3" align="center" color="yellow" width="2"></a-text>

        <!-- ТЕКСТ С КООРДИНАТАМИ (Шрифт уменьшен: width="1.5") -->
        <a-text id="debugText" value="" position="0 -0.5 -3" align="center" color="cyan" width="1.5"></a-text>

        <!-- ПРИЦЕЛ -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- ТУРЕЛЬ -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2">
        </a-entity>

      </a-camera>
    </a-scene>
  </body>
</html>
