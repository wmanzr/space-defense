<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      window.score = 0;

      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.gameStarted = false;
          this.enemiesSpawned = false;

          // Слушаем тапы по всему экрану
          window.addEventListener('touchstart', this.onTap.bind(this));
          window.addEventListener('mousedown', this.onTap.bind(this));
        },

        onTap: function () {
          // ПЕРВЫЙ ТАП: Запуск игры и запросов
          if (!this.gameStarted) {
            this.gameStarted = true;
            this.initPermissions();
          } 
          // ПОСЛЕДУЮЩИЕ ТАПЫ: Стрельба
          else if (this.enemiesSpawned) {
            this.shoot();
          }
        },

        initPermissions: function () {
          let infoText = document.querySelector('#infoText');
          infoText.setAttribute('value', 'REQUESTING PERMISSIONS...');

          // Вызов СИСТЕМНОГО окна гироскопа iOS (без кастомных белых экранов)
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
              .then(state => {
                if (state === 'granted') this.getGPS(infoText);
                else infoText.setAttribute('value', 'GYRO DENIED!\nRELOAD PAGE');
              })
              .catch(console.error);
          } else {
            this.getGPS(infoText);
          }
        },

        getGPS: function (infoText) {
          infoText.setAttribute('value', 'SEARCHING GPS...');

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              infoText.setAttribute('value', 'ENEMIES DETECTED!');
              
              let lat = pos.coords.latitude;
              let lon = pos.coords.longitude;
              
              // ВЫВОДИМ КООРДИНАТЫ МЕЛКИМ ШРИФТОМ НА ЭКРАН
              document.querySelector('#debugText').setAttribute('value', `LAT: ${lat.toFixed(5)}\nLON: ${lon.toFixed(5)}`);

              // Спавним 4 врагов крестом (Север, Юг, Восток, Запад)
              if (!this.enemiesSpawned) {
                this.enemiesSpawned = true;
                let offset = 0.00004; // Около 4 метров от тебя
                
                this.spawnEnemy(lat + offset, lon); // Север
                this.spawnEnemy(lat - offset, lon); // Юг
                this.spawnEnemy(lat, lon + offset); // Восток
                this.spawnEnemy(lat, lon - offset); // Запад
              }
            },
            (err) => {
              infoText.setAttribute('value', 'GPS ERROR!\nTAP TO RETRY');
              this.gameStarted = false; // Разрешаем тапнуть снова для рестарта GPS
            },
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
          );
        },

        spawnEnemy: function(lat, lon) {
          let scene = document.querySelector('a-scene');
          let enemy = document.createElement('a-entity');
          
          // Огромный яркий шар без лишней анимации (стоит на месте)
          enemy.setAttribute('geometry', 'primitive: sphere; radius: 1.5');
          enemy.setAttribute('material', 'color: #ff00ff; shader: flat');
          enemy.setAttribute('class', 'enemy');
          enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          enemy.setAttribute('position', '0 0 0'); // AR.js сам поднимет их на нужную высоту
          
          scene.appendChild(enemy);
        },

        shoot: function () {
          // Вызываем анимацию отдачи турели
          let turret = document.querySelector('#player-turret');
          if(turret) turret.emit('fire');

          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              target.parentNode.removeChild(target);
              
              let infoText = document.querySelector('#infoText');
              if (window.score >= 4) {
                infoText.setAttribute('value', 'MISSION ACCOMPLISHED!');
                infoText.setAttribute('color', '#00FF00');
              } else {
                infoText.setAttribute('value', 'KILLED: ' + window.score + ' / 4');
              }
            }
          }
        }
      });
    </script>
    
    <style> 
      /* Убираем черную кнопку VR в правом нижнем углу */
      .a-enter-vr { display: none !important; } 
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- 
      СЦЕНА 
      device-orientation-permission-ui="enabled: false" - убивает кастомный белый экран с кнопкой! 
    -->
    <a-scene 
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      game-manager>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <!-- КАМЕРА -->
      <a-camera id="main-camera" gps-camera="positionMinAccuracy: 100000;" rotation-reader>
        
        <!-- НАДПИСЬ ИНФОРМАЦИИ (Маленький шрифт: width="1.5") -->
        <a-text id="infoText" value="TAP SCREEN TO START" position="0 0.4 -2" align="center" color="yellow" width="1.5"></a-text>

        <!-- ТЕКСТ С КООРДИНАТАМИ (Очень мелкий шрифт: width="1") -->
        <a-text id="debugText" value="" position="0 0.1 -2" align="center" color="cyan" width="1"></a-text>

        <!-- ПРИЦЕЛ (Увеличена дальность луча - far: 100, чтобы 100% доставал до шаров) -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy; far: 100"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- ТУРЕЛЬ с отдачей (animation__recoil) как в index.html -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2"
                  animation__recoil="property: position; from: 0 -1 -1.5; to: 0 -1 -1.2; dur: 50; dir: alternate; repeat: 1; startEvents: fire">
        </a-entity>

      </a-camera>
    </a-scene>
  </body>
</html>
