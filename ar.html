<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      window.score = 0;
      let enemiesSpawned = false;

      // 1. КОМПОНЕНТ СТРЕЛЬБЫ
      AFRAME.registerComponent('shooter', {
        init: function () {
          window.addEventListener('touchstart', this.shoot.bind(this));
          window.addEventListener('mousedown', this.shoot.bind(this));
        },
        shoot: function () {
          let turret = document.querySelector('#player-turret');
          if(turret) turret.emit('fire');

          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              target.parentNode.removeChild(target);
              
              let infoText = document.querySelector('#infoText');
              if (window.score >= 3) {
                // Текст переведен на английский, чтобы A-Frame его увидел
                infoText.setAttribute('value', 'MISSION ACCOMPLISHED!');
                infoText.setAttribute('color', '#00FF00');
              } else {
                infoText.setAttribute('value', 'KILLED: ' + window.score + ' / 3');
              }
            }
          }
        }
      });

      // 2. БЫСТРЫЙ МЕНЕДЖЕР AR
      AFRAME.registerComponent('ar-manager', {
        init: function () {
          let startBtn = document.getElementById('start-btn');
          let uiOverlay = document.getElementById('ui-overlay');
          let infoText = document.querySelector('#infoText');
          let debugText = document.querySelector('#debugText'); // Новый текст для координат

          startBtn.addEventListener('click', () => {
            startBtn.innerText = "РАСЧЕТ КООРДИНАТ...";

            // 1. Гироскоп (Для Apple)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
              DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') fastGPS();
                else alert("Для AR нужен гироскоп!");
              }).catch(console.error);
            } else {
              fastGPS();
            }

            // 2. Мгновенное получение координат
            function fastGPS() {
              navigator.geolocation.getCurrentPosition(
                (pos) => {
                  uiOverlay.style.display = 'none';
                  infoText.setAttribute('value', 'ENEMIES DETECTED!');

                  let lat = pos.coords.latitude;
                  let lon = pos.coords.longitude;
                  
                  // ВЫВОДИМ КООРДИНАТЫ НА ЭКРАН (Округлено до 5 знаков)
                  debugText.setAttribute('value', `LAT: ${lat.toFixed(5)}\nLON: ${lon.toFixed(5)}`);

                  // Смещение координат на 10-15 метров от игрока, чтобы они не появились внутри него
                  let offset = 0.0001; 

                  if (!enemiesSpawned) {
                    enemiesSpawned = true;
                    // Спавним 3 огромных фиолетовых шара вокруг
                    spawnEnemy(lat + offset, lon); 
                    spawnEnemy(lat, lon + offset); 
                    spawnEnemy(lat - offset, lon - offset); 
                  }
                },
                (err) => {
                  alert("Не удалось определить местоположение. Проверьте включен ли GPS.");
                  startBtn.innerText = "ПОВТОРИТЬ";
                },
                { enableHighAccuracy: false, timeout: 10000, maximumAge: 0 }
              );
            }

            function spawnEnemy(lat, lon) {
              let scene = document.querySelector('a-scene');
              let enemy = document.createElement('a-entity');
              
              // ДЕЛАЕМ ВРАГОВ ОГРОМНЫМИ И ЯРКИМИ
              // radius: 3 - это шар размером с машину. shader: flat - он будет светиться даже в темноте!
              enemy.setAttribute('geometry', 'primitive: sphere; radius: 3');
              enemy.setAttribute('material', 'color: #ff00ff; shader: flat');
              enemy.setAttribute('class', 'enemy');
              enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
              
              // Делаем так, чтобы они летали вверх-вниз в небе (от 3 до 6 метров)
              enemy.setAttribute('position', '0 3 0');
              enemy.setAttribute('animation', 'property: position; to: 0 6 0; dir: alternate; dur: 2000; loop: true');
              
              scene.appendChild(enemy);
            }
          });
        }
      });
    </script>

    <style>
      #ui-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-family: sans-serif; text-align: center;
      }
      #start-btn {
        padding: 20px 40px; font-size: 20px; font-weight: bold;
        background-color: #00FF00; border: none; border-radius: 10px; cursor: pointer;
        margin-top: 20px; box-shadow: 0 4px 10px rgba(0,255,0,0.5);
      }
      .warning { color: white; padding: 0 20px; font-size: 18px; }
      .a-enter-vr { display: none !important; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <div id="ui-overlay">
      <div class="warning">
        <h2>AR РАДАР</h2>
        <p>Наведите камеру вокруг себя, чтобы найти цели.</p>
      </div>
      <button id="start-btn">НАЧАТЬ</button>
    </div>

    <!-- arjs-сцена с включенной отладкой -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      ar-manager shooter>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <a-camera id="main-camera" gps-camera="positionMinAccuracy: 100000;" rotation-reader>
        
        <!-- Текст статуса ("ENEMIES DETECTED!") -->
        <a-text id="infoText" value="" position="0 0.5 -3" align="center" color="yellow" width="4"></a-text>

        <!-- ТЕКСТ С КООРДИНАТАМИ (Новый) -->
        <a-text id="debugText" value="GPS: WAITING" position="0 -0.5 -3" align="center" color="cyan" width="3"></a-text>

        <!-- Прицел -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- Турель -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2" 
                  animation__recoil="property: position; from: 0 -1 -1.5; to: 0 -1 -1.2; dur: 50; dir: alternate; repeat: 1; startEvents: fire">
        </a-entity>

      </a-camera>
    </a-scene>
  </body>
</html>
