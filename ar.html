<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <script>
      window.score = 0;
      let gpsLoaded = false;

      // 1. КОМПОНЕНТ СТРЕЛЬБЫ (Точно как в index.html)
      AFRAME.registerComponent('shooter', {
        init: function () {
          window.addEventListener('touchstart', this.shoot.bind(this));
          window.addEventListener('mousedown', this.shoot.bind(this));
        },
        shoot: function () {
          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          // Анимация отдачи турели при стрельбе
          let turret = document.querySelector('#player-turret');
          if(turret) turret.emit('fire');

          // Если попали в цель
          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              
              // Удаляем убитого врага
              target.parentNode.removeChild(target);
              
              // Проверяем победу
              if (window.score >= 3) {
                document.querySelector('#infoText').setAttribute('value', 'YOU WIN! ALL ENEMIES DESTROYED');
                document.querySelector('#infoText').setAttribute('color', '#00FF00'); // Зеленый текст
              } else {
                document.querySelector('#infoText').setAttribute('value', 'KILLED: ' + window.score + ' / 3');
              }
            }
          }
        }
      });

      // 2. КОМПОНЕНТ GPS (Спавн объектов вокруг игрока)
      AFRAME.registerComponent('gps-spawner', {
        init: function () {
          // Ждем системного события AR.js, когда он сам получит геопозицию
          window.addEventListener('gps-camera-update-position', (e) => {
            // Чтобы не спавнить бесконечно, делаем проверку
            if (gpsLoaded) return; 
            gpsLoaded = true;

            // Берем твои точные координаты в эту секунду
            let lat = e.detail.position.latitude;
            let lon = e.detail.position.longitude;

            document.querySelector('#infoText').setAttribute('value', 'ENEMIES DETECTED! LOOK AROUND.');

            // Смещение координат. 0.00005 градусов — это примерно 5 метров.
            let offset = 0.00005; 

            // Ставим трех врагов вокруг тебя по компасу
            this.spawnEnemy(lat + offset, lon); // Спереди
            this.spawnEnemy(lat, lon + offset); // Справа
            this.spawnEnemy(lat - offset, lon - offset); // Сзади-слева
          });
        },
        
        spawnEnemy: function(lat, lon) {
          let scene = document.querySelector('a-scene');
          let enemy = document.createElement('a-entity');
          
          // Я делаю их сферами. Если хочешь модель дракона, напиши тут: 
          // enemy.setAttribute('gltf-model', 'assets/dragon.glb');
          enemy.setAttribute('geometry', 'primitive: sphere; radius: 1');
          enemy.setAttribute('material', 'color: purple');
          
          enemy.setAttribute('class', 'enemy'); // Обязательно для прицела
          
          // Привязываем к вычисленным GPS координатам
          enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          
          // Поднимаем на уровень глаз (1.5 метра над землей)
          enemy.setAttribute('position', '0 1.5 0');
          
          scene.appendChild(enemy);
        }
      });
    </script>
  </head>

  <body style="margin: 0; overflow: hidden;">
    <!-- arjs: используем камеру. debugUIEnabled: false убирает лишние надписи разработчика -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      gps-spawner shooter>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <!-- КАМЕРА AR.JS -->
      <a-camera gps-camera rotation-reader>
        
        <!-- Информационный текст (всегда висит перед экраном) -->
        <a-text id="infoText" value="Waiting for GPS..." position="0 0.5 -2" align="center" color="yellow" width="4"></a-text>

        <!-- Прицел для стрельбы -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- ТУРЕЛЬ -->
        <!-- Она вложена внутрь <a-camera>, поэтому она ВСЕГДА перемещается за тобой. -->
        <!-- Позиция: 0 (центр), -1 (под ногами), -1.5 (чуть-чуть вынесена вперед, чтобы было видно дуло) -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2" 
                  animation__recoil="property: position; from: 0 -1 -1.5; to: 0 -1 -1.2; dur: 50; dir: alternate; repeat: 1; startEvents: fire">
        </a-entity>

      </a-camera>

    </a-scene>
  </body>
</html>
