<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      window.score = 0;

      // ЕДИНЫЙ МЕНЕДЖЕР ИГРЫ (Управляет и разрешениями, и стрельбой)
      AFRAME.registerComponent('game-manager', {
        init: function () {
          this.gameStarted = false;
          this.enemiesSpawned = false;

          // Вешаем слушатель тапа по экрану
          window.addEventListener('touchstart', this.onTap.bind(this));
          window.addEventListener('mousedown', this.onTap.bind(this));
        },

        onTap: function () {
          // ПЕРВЫЙ ТАП: Запрашиваем разрешения
          if (!this.gameStarted) {
            this.gameStarted = true;
            this.initPermissions();
          } 
          // ПОСЛЕДУЮЩИЕ ТАПЫ: Стреляем
          else if (this.enemiesSpawned) {
            this.shoot();
          }
        },

        // Запрос системных разрешений
        initPermissions: function () {
          let infoText = document.querySelector('#infoText');
          infoText.setAttribute('value', 'GETTING PERMISSIONS...');

          // 1. Запрос Гироскопа (Обязательно по правилам Apple)
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
              .then(permissionState => {
                if (permissionState === 'granted') {
                  this.getGPS(infoText);
                } else {
                  infoText.setAttribute('value', 'GYRO DENIED!\nRELOAD PAGE');
                }
              })
              .catch(console.error);
          } else {
            // Если устройство Android или старый iOS
            this.getGPS(infoText);
          }
        },

        // Запрос Геолокации
        getGPS: function (infoText) {
          infoText.setAttribute('value', 'SEARCHING SATELLITES...');

          navigator.geolocation.getCurrentPosition(
            (pos) => {
              infoText.setAttribute('value', 'ENEMIES DETECTED!');
              
              let lat = pos.coords.latitude;
              let lon = pos.coords.longitude;
              
              // Вывод координат на экран для проверки
              document.querySelector('#debugText').setAttribute('value', `LAT: ${lat.toFixed(5)}\nLON: ${lon.toFixed(5)}`);

              if (!this.enemiesSpawned) {
                this.enemiesSpawned = true;
                let offset = 0.0001; // Смещение около 10 метров
                
                this.spawnEnemy(lat + offset, lon); 
                this.spawnEnemy(lat, lon + offset); 
                this.spawnEnemy(lat - offset, lon - offset); 
              }
            },
            (err) => {
              // Если GPS дал сбой, разрешаем тапнуть еще раз для повторной попытки
              infoText.setAttribute('value', 'GPS ERROR!\nTAP TO RETRY');
              this.gameStarted = false; 
            },
            // maximumAge: 60000 берет координаты из кэша (до 1 минуты давности), что ускоряет загрузку
            { enableHighAccuracy: false, timeout: 15000, maximumAge: 60000 }
          );
        },

        // Функция создания врагов
        spawnEnemy: function(lat, lon) {
          let scene = document.querySelector('a-scene');
          let enemy = document.createElement('a-entity');
          
          enemy.setAttribute('geometry', 'primitive: sphere; radius: 2');
          enemy.setAttribute('material', 'color: #ff00ff; shader: flat');
          enemy.setAttribute('class', 'enemy');
          enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
          
          // ОЧЕНЬ ПЛАВНАЯ И МЕДЛЕННАЯ АНИМАЦИЯ (Легкое парение)
          enemy.setAttribute('animation', 'property: position; from: 0 1.5 0; to: 0 2.0 0; dir: alternate; dur: 4000; loop: true; easing: easeInOutSine');
          
          scene.appendChild(enemy);
        },

        // Функция стрельбы
        shoot: function () {
          let turret = document.querySelector('#player-turret');
          if(turret) turret.emit('fire');

          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              target.parentNode.removeChild(target);
              
              let infoText = document.querySelector('#infoText');
              if (window.score >= 3) {
                infoText.setAttribute('value', 'MISSION ACCOMPLISHED!');
                infoText.setAttribute('color', '#00FF00');
              } else {
                infoText.setAttribute('value', 'KILLED: ' + window.score + ' / 3');
              }
            }
          }
        }
      });
    </script>
    
    <!-- Скрываем техническую кнопку VR, генерируемую A-Frame -->
    <style> .a-enter-vr { display: none !important; } </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- СЦЕНА -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      game-manager>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <!-- КАМЕРА -->
      <a-camera id="main-camera" gps-camera="positionMinAccuracy: 100000;" rotation-reader>
        
        <!-- СТАРТОВАЯ НАДПИСЬ -->
        <a-text id="infoText" value="TAP SCREEN TO START" position="0 0.5 -3" align="center" color="yellow" width="4"></a-text>

        <!-- ТЕКСТ С КООРДИНАТАМИ -->
        <a-text id="debugText" value="" position="0 -0.5 -3" align="center" color="cyan" width="3"></a-text>

        <!-- ПРИЦЕЛ -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- ТУРЕЛЬ -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2" 
                  animation__recoil="property: position; from: 0 -1 -1.5; to: 0 -1 -1.2; dur: 50; dir: alternate; repeat: 1; startEvents: fire">
        </a-entity>

      </a-camera>
    </a-scene>
  </body>
</html>
