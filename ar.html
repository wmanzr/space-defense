<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR GPS Defense</title>
    <!-- Официальные библиотеки -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <script>
      window.score = 0;
      let enemiesSpawned = false;

      // 1. КОМПОНЕНТ СТРЕЛЬБЫ (Надежный перехват тапов по экрану)
      AFRAME.registerComponent('shooter', {
        init: function () {
          window.addEventListener('touchstart', this.shoot.bind(this));
          window.addEventListener('mousedown', this.shoot.bind(this));
        },
        shoot: function () {
          let turret = document.querySelector('#player-turret');
          if(turret) turret.emit('fire'); // Анимация выстрела

          let raycaster = document.querySelector('#cursor').components.raycaster;
          let intersected = raycaster.intersectedEls;

          if (intersected.length > 0) {
            let target = intersected[0];
            if (target.classList.contains('enemy')) {
              window.score++;
              target.parentNode.removeChild(target);
              
              let infoText = document.querySelector('#infoText');
              if (window.score >= 3) {
                infoText.setAttribute('value', 'YOU WIN!');
                infoText.setAttribute('color', '#00FF00');
              } else {
                infoText.setAttribute('value', 'KILLED: ' + window.score + ' / 3');
              }
            }
          }
        }
      });

      // 2. УМНЫЙ МЕНЕДЖЕР AR
      AFRAME.registerComponent('ar-manager', {
        init: function () {
          let startBtn = document.getElementById('start-btn');
          let uiOverlay = document.getElementById('ui-overlay');
          let infoText = document.querySelector('#infoText');

          startBtn.addEventListener('click', () => {
            // ШАГ 1: Разблокировка гироскопа (Apple требует клика)
            // Если разрешение уже дано ранее, окно не появится, код просто пойдет дальше - это НОРМАЛЬНО.
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
              DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') startGame();
                else alert("Для работы AR нужен гироскоп!");
              }).catch(console.error);
            } else {
              startGame(); // Для Android или старых iOS
            }

            function startGame() {
              // Прячем меню
              uiOverlay.style.display = 'none';
              
              // Меняем текст на экране
              infoText.setAttribute('value', 'ИЩУ СПУТНИКИ GPS...\nПОДОЙДИТЕ К ОКНУ');

              // ШАГ 2: Слушаем саму библиотеку AR.js
              // Она сама получит координаты телефона. Мы просто ждем ее сигнала.
              window.addEventListener('gps-camera-update-position', function (e) {
                // Если мы уже создали врагов, больше не создаем
                if (enemiesSpawned) return;
                enemiesSpawned = true;

                infoText.setAttribute('value', 'ВРАГИ ОБНАРУЖЕНЫ!');

                // Берем координаты, которые нашел AR.js
                let lat = e.detail.position.latitude;
                let lon = e.detail.position.longitude;
                let offset = 0.00005; // Радиус спавна около 5 метров

                // Создаем 3 дракона (сферы) вокруг
                spawnEnemy(lat + offset, lon); 
                spawnEnemy(lat, lon + offset); 
                spawnEnemy(lat - offset, lon - offset); 
              });
            }

            // Функция отрисовки врагов в реальном мире
            function spawnEnemy(lat, lon) {
              let scene = document.querySelector('a-scene');
              let enemy = document.createElement('a-entity');
              
              enemy.setAttribute('geometry', 'primitive: sphere; radius: 1.5');
              enemy.setAttribute('material', 'color: purple');
              enemy.setAttribute('class', 'enemy');
              
              // Привязка к физическим координатам планеты Земля
              enemy.setAttribute('gps-entity-place', `latitude: ${lat}; longitude: ${lon}`);
              // Высота над землей (2 метра)
              enemy.setAttribute('position', '0 2 0');
              
              scene.appendChild(enemy);
            }
          });
        }
      });
    </script>

    <style>
      #ui-overlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0, 0, 0, 0.9); z-index: 9999;
        display: flex; flex-direction: column; justify-content: center; align-items: center;
        font-family: sans-serif; text-align: center;
      }
      #start-btn {
        padding: 20px 40px; font-size: 20px; font-weight: bold;
        background-color: #00FF00; border: none; border-radius: 10px; cursor: pointer;
        margin-top: 20px;
      }
      .warning { color: white; padding: 0 20px; font-size: 18px; }
      /* Скрываем кривое окно "Author permission" от AR.js, чтобы оно не мозолило глаза */
      .a-enter-vr { display: none !important; }
    </style>
  </head>

  <body style="margin: 0; overflow: hidden;">
    
    <!-- Стартовое меню-оверлей -->
    <div id="ui-overlay">
      <div class="warning">
        <h2>AR РАДАР</h2>
        <p>1. Нажмите "Начать".<br>2. Разрешите использование камеры и геолокации (если телефон спросит).<br>3. Смотрите по сторонам.</p>
      </div>
      <button id="start-btn">НАЧАТЬ</button>
    </div>

    <!-- СЦЕНА -->
    <a-scene 
      vr-mode-ui="enabled: false"
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      ar-manager shooter>

      <a-assets>
        <a-asset-item id="turret-model" src="assets/turel.glb"></a-asset-item>
      </a-assets>

      <!-- 
        КАМЕРА: Самое важное исправление! 
        positionMinAccuracy: 3000 позволяет принять даже ужасный сигнал GPS в квартире.
        В противном случае AR.js просто игнорирует сигнал и загрузка идет бесконечно.
      -->
      <a-camera id="main-camera" gps-camera="positionMinAccuracy: 3000;" rotation-reader>
        
        <!-- Текст статуса в центре экрана -->
        <a-text id="infoText" value="" position="0 0.5 -3" align="center" color="yellow" width="3"></a-text>

        <!-- Прицел -->
        <a-entity id="cursor" 
                  cursor="rayOrigin: entity; fuse: false"
                  raycaster="objects: .enemy"
                  position="0 0 -1"
                  geometry="primitive: ring; radiusInner: 0.02; radiusOuter: 0.03"
                  material="color: red; shader: flat">
        </a-entity>

        <!-- Турель -->
        <a-entity id="player-turret" 
                  gltf-model="#turret-model" 
                  position="0 -1 -1.5" 
                  scale="0.2 0.2 0.2" 
                  animation__recoil="property: position; from: 0 -1 -1.5; to: 0 -1 -1.2; dur: 50; dir: alternate; repeat: 1; startEvents: fire">
        </a-entity>

      </a-camera>
    </a-scene>
  </body>
</html>
